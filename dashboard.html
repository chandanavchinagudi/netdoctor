<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NetDoctor Dashboard</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="container">
    <h1>🩺 NetDoctor</h1>
    <p class="subtitle">Zero-dependency Network Diagnostics</p>

    <div class="card">
      <form method="GET" action="/">
        <input type="text" name="target" placeholder="Enter hostname or IP (e.g. google.com)" 
               value="TARGET_VALUE" required>
        <button type="submit">Diagnose</button>
      </form>
    </div>

    RESULT_SECTION

    <p class="footer">NetDoctor • Pure Python Standard Library • Zero Dependencies</p>
  </div>
</body>
</html>
